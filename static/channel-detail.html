<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="/static/theme.js"></script>
  <title>Channel Detail — QS Analytics</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a; --border: #2e3347;
      --accent: #6366f1; --accent2: #818cf8; --text: #e2e8f0; --text2: #94a3b8;
      --green: #22c55e; --red: #ef4444; --yellow: #f59e0b; --orange: #f97316;
      --radius: 10px; --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; }

    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 28px 60px; }

    /* Header */
    .ch-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .ch-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; display: flex; align-items: center; gap: 10px; }
    .ch-header .subtitle { font-size: 13px; color: var(--text2); margin-top: 6px; }
    .back-link { color: var(--accent2); text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 6px; }
    .back-link:hover { text-decoration: underline; }
    .pill { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; background: rgba(99,102,241,0.15); color: var(--accent2); letter-spacing: .2px; }

    /* Controls */
    .header-controls { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
    .presets { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .preset-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text2); border-radius: 999px; padding: 5px 12px; font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer; transition: color .15s, border-color .15s, background .15s; }
    .preset-btn:hover { color: var(--text); border-color: var(--accent); }
    .preset-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .controls { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .controls label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--text2); font-weight: 500; }
    .controls input, .controls select { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 10px; font-family: inherit; font-size: 13px; }
    .btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: var(--accent2); }
    .btn.ghost { background: none; border: 1px solid var(--border); color: var(--text2); }
    .btn.ghost:hover { color: var(--text); border-color: var(--accent); }

    /* Section */
    .section { margin-top: 26px; }
    .section > h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--text2); margin-bottom: 12px; }

    /* Stat cards */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
    .stat .label { font-size: 11px; color: var(--text2); font-weight: 500; text-transform: uppercase; letter-spacing: .3px; }
    .stat .value { font-size: 22px; font-weight: 700; margin-top: 6px; letter-spacing: -0.5px; }
    .stat .value.pos { color: var(--green); }
    .stat .sub { font-size: 11px; color: var(--text2); margin-top: 3px; }
    .val-good { color: var(--green); } .val-warn { color: var(--yellow); } .val-bad { color: var(--red); }

    /* ROI card */
    .roi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
    .roi-input-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
    .roi-input-row label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text2); font-weight: 500; }
    .roi-input-row input { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 12px; font-family: inherit; font-size: 14px; width: 160px; }
    .roi-hint { font-size: 12px; color: var(--text2); }
    .roi-metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }

    /* Quality bar */
    .lq-bar { display: flex; height: 26px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
    .lq-seg { display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #0f1117; min-width: 0; }
    .lq-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--text2); }
    .lq-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .lq-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .table-scroll { overflow-x: auto; }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
    th { background: var(--surface2); font-weight: 600; color: var(--text2); font-size: 11px; text-transform: uppercase; letter-spacing: .3px; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    .money { color: var(--green); }
    .link { color: var(--accent2); text-decoration: none; }
    .link:hover { text-decoration: underline; }

    .empty, .loading { color: var(--text2); padding: 24px; text-align: center; font-size: 13px; }
    .note { background: rgba(99,102,241,0.08); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; font-size: 13px; color: var(--text2); }
    .note a { color: var(--accent2); }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="ch-header">
      <div>
        <a class="back-link" href="/dashboard" id="back-link">← Back to Lead Quality by Channel</a>
        <h1><span id="ch-name">Channel</span> <span class="pill" id="ch-pill" style="display:none"></span></h1>
        <div class="subtitle" id="ch-subtitle">Loading…</div>
      </div>
      <div class="header-controls">
        <div class="presets" id="presets">
          <button class="preset-btn" data-preset="7d">Last 7 days</button>
          <button class="preset-btn" data-preset="30d">Last 30D</button>
          <button class="preset-btn" data-preset="thismonth">This month</button>
          <button class="preset-btn" data-preset="lastmonth">Last month</button>
          <button class="preset-btn" data-preset="3m">Last 3 months</button>
        </div>
        <div class="controls">
          <label>From<input type="date" id="f-start"></label>
          <label>To<input type="date" id="f-end"></label>
          <label>Date by
            <select id="f-dateby">
              <option value="appointment">Appointment</option>
              <option value="booked">Booked</option>
              <option value="created">Created</option>
            </select>
          </label>
          <button class="btn" id="apply-btn">Apply</button>
        </div>
      </div>
    </div>

    <div id="content"><div class="loading">Loading channel metrics…</div></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const CHANNEL = params.get('channel') || 'Unknown';
    const today = () => new Date().toISOString().slice(0, 10);
    const monthAgo = () => { const d = new Date(); d.setDate(d.getDate() - 30); return d.toISOString().slice(0, 10); };
    let START = params.get('start') || monthAgo();
    let END = params.get('end') || today();
    let DATE_BY = params.get('date_by') || 'appointment';
    const RETELL_CHANNEL = 'Retell (VERA)';
    const APPOINTWISE_CHANNEL = 'AI Bot (Appointwise)';
    const AI_CHANNELS = new Set([RETELL_CHANNEL, APPOINTWISE_CHANNEL]);
    const isAI = AI_CHANNELS.has(CHANNEL);
    const GHL_CONTACT_BASE = 'https://app.gohighlevel.com/v2/location/G7ZOWCq78JrzUjlLMCxt/contacts/detail';
    const RETELL_CALL_BASE = 'https://dashboard.retellai.com/calls';
    let dqMode = 'all';
    let connMode = 'all';
    let minMin = '0';

    // ── formatting ──
    const money = v => (v || v === 0) ? '$' + Math.round(v).toLocaleString() : '—';
    const num = v => (v || v === 0) ? v.toLocaleString() : '0';
    const pct = r => (r === null || r === undefined) ? '—' : (r * 100).toFixed(1) + '%';
    const rateCls = (r, good, bad) => r === null ? '' : (r >= good ? 'val-good' : (r <= bad ? 'val-bad' : 'val-warn'));

    function qs() { return `channel=${encodeURIComponent(CHANNEL)}&start=${START}&end=${END}&date_by=${DATE_BY}`; }

    async function apiFetch(path) {
      const res = await fetch(path);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    const esc = s => String(s).replace(/"/g, '&quot;');
    function statCard(label, value, sub, cls, tip) {
      const t = tip ? ` data-tip="${esc(tip)}"` : '';
      return `<div class="stat"${t}><div class="label">${label}</div><div class="value ${cls || ''}">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
    }

    const LQ_COLORS = { great: '#22c55e', ok: '#84cc16', barely: '#f59e0b', bad: '#ef4444', missing: '#64748b' };

    function renderQualityBar(h) {
      const segs = [
        ['Great', h.great_count, LQ_COLORS.great],
        ['Ok', h.ok_count, LQ_COLORS.ok],
        ['Barely', h.barely_passable_count, LQ_COLORS.barely],
        ['Bad', h.bad_count, LQ_COLORS.bad],
        ['Missing', h.missing_data_count, LQ_COLORS.missing],
      ];
      const total = segs.reduce((s, x) => s + (x[1] || 0), 0);
      if (!total) return '<div class="empty">No graded shows in this period.</div>';
      const bar = segs.filter(s => s[1] > 0).map(s =>
        `<div class="lq-seg" style="flex:${s[1]};background:${s[2]}" title="${s[0]}: ${s[1]}">${s[1]}</div>`).join('');
      const legend = segs.map(s =>
        `<span><span class="lq-dot" style="background:${s[2]}"></span>${s[0]}: ${s[1] || 0}</span>`).join('');
      return `<div class="lq-bar">${bar}</div><div class="lq-legend">${legend}</div>`;
    }

    const COST_SRC_LABEL = { retell: 'Retell billing', xero: 'Xero (Retellai)', manual: 'manual entry' };
    function renderRoi(roi) {
      const manualSet = roi.manual_set;
      const costVal = manualSet ? Math.round(roi.cost) : '';
      const m = (label, val, isX, tip) => statCard(label, val === null || val === undefined ? '—' : (isX ? val + '×' : money(val)), null, null, tip);
      let hint;
      if (manualSet) hint = `Manual cost for ${START} → ${END}. Clear to fall back to Retell / Xero.`;
      else if (roi.is_set) hint = `Auto: ${money(roi.cost)} from ${COST_SRC_LABEL[roi.cost_source] || 'source'}. Enter a value to override.`;
      else hint = 'Enter the channel cost (ad spend / tool subscription) for this range, or it auto-pulls from Retell / Xero when available.';
      return `
        <div class="roi-card">
          <div class="roi-input-row">
            <label>Channel cost (this range)
              <input type="number" id="cost-input" placeholder="${roi.is_set ? Math.round(roi.cost) : 'e.g. 1500'}" value="${costVal}" min="0" step="1">
            </label>
            <button class="btn" id="save-cost">Save</button>
            ${manualSet ? '<button class="btn ghost" id="clear-cost">Clear</button>' : ''}
            <span class="roi-hint">${hint}</span>
          </div>
          <div class="roi-metrics">
            ${m('Cash ROI', roi.roi, true, 'Cash Collected ÷ Channel cost for this range. e.g. 8× = $8 collected per $1 spent.')}
            ${m('Contract ROI', roi.contract_roi, true, 'Contracted Total ÷ Channel cost (forward-looking — counts projected full contract, not just cash in yet).')}
            ${m('Cost / Show', roi.cost_per_show, false, 'Channel cost ÷ Shows — what it costs to get one prospect to show up.')}
            ${m('Cost / Qualified', roi.cost_per_qualified, false, 'Channel cost ÷ Qualified shows.')}
            ${m('Cost / Close', roi.cost_per_close, false, 'Channel cost ÷ Units Closed — customer acquisition cost for this channel.')}
          </div>
        </div>`;
    }

    function renderRepTable(reps) {
      if (!reps.length) return '<div class="empty">No reps with activity on this channel.</div>';
      const rows = reps.map(r => `
        <tr>
          <td>${r.rep}</td>
          <td class="num">${num(r.total_ops)}</td>
          <td class="num">${num(r.shows)}</td>
          <td class="num">${num(r.qualified)}</td>
          <td class="num">${num(r.units_closed)}</td>
          <td class="num money">${money(r.cash_collected)}</td>
          <td class="num money">${money(r.whop_projected_total)}</td>
        </tr>`).join('');
      return `<div class="table-scroll"><table>
        <thead><tr><th>Rep</th><th class="num">Opps</th><th class="num">Shows</th><th class="num">Qualified</th>
        <th class="num">Closed</th><th class="num">Cash Collected</th><th class="num">Contracted Total</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
    }

    function renderCloses(closes) {
      if (!closes.length) return '<div class="empty">No closed deals for this channel in the selected period.</div>';
      const rows = closes.map(d => `
        <tr>
          <td>${d.name}</td>
          <td>${d.rep}</td>
          <td>${d.close_date}</td>
          <td class="num">${d.value !== null ? money(d.value) : '—'}</td>
          <td class="num money">${d.cash_paid ? money(d.cash_paid) : '—'}</td>
          <td class="num money">${d.whop_projected ? money(d.whop_projected) : '—'}</td>
        </tr>`).join('');
      return `<div class="table-scroll"><table>
        <thead><tr><th>Opportunity</th><th>Closer</th><th>Close Date</th>
        <th class="num">Deal Value (GHL)</th><th class="num">Cash Paid</th><th class="num">Contracted Total</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
    }

    function renderAiSection(ai, roi) {
      if (!ai) return '';
      const c = ai.confidence || {};
      const total = (c.source_confirmed || 0) + (c.tag_inferred || 0);
      const tagPct = total ? Math.round((c.tag_inferred / total) * 100) : 0;
      const hasCost = roi && roi.is_set;
      const costStr = hasCost ? money(roi.cost) : '—';
      let cards;
      if (ai.calls) {
        // Retell voice funnel: Dialed → Picked Up → Booked → Converted → Conv. Rate → Cost.
        cards = `
        ${statCard('Dialed', num(ai.dialed), `${num(ai.dialed_contacts)} contacts · ${ai.calls.minutes} min`, null,
          'Total Retell voice calls placed in this range (from the Retell API — the only source of call volume). Includes retries, so it exceeds the number of unique contacts dialed (shown below).')}
        ${statCard('Picked Up', num(ai.picked_up), pct(ai.pickup_rate) + ' of dials', null,
          'Calls a human actually answered — had talk time and a non-no-answer disconnect reason. The rest rang out, hit voicemail, or failed. Rate is per dial (retries included).')}
        ${statCard('Booked', num(ai.booked), null, null,
          'Calls that produced a booked opportunity (Sales pipeline, internal contacts excluded).')}
        ${statCard('Converted', num(ai.won), 'won', null,
          'Booked opportunities that reached the Deal Won stage.')}
        ${statCard('Conv. Rate', pct(ai.conv_rate), 'booked ÷ contacts', rateCls(ai.conv_rate, 0.01, 0.003),
          'Booked ÷ unique contacts dialed — top-of-funnel booking conversion (matches the ~1.3% baseline; uses unique contacts, not raw dials, since a contact is retried many times).')}
        ${statCard('Cost', costStr, hasCost ? (COST_SRC_LABEL[roi.cost_source] || 'this range') : 'set in ROI', null,
          'Channel cost for this range — auto-pulled from Retell billing, else the Xero "Retellai" expense line; a manual value in the ROI section overrides. Drives ROI and cost-per-X.')}
        ${statCard('Held', num(ai.held), 'showed up', null,
          "Booked calls the prospect attended — held-call stages or Call-1 status 'Showed'.")}
        ${statCard('Held Rate', pct(ai.held_rate), null, rateCls(ai.held_rate, 0.5, 0.25), 'Held ÷ Booked.')}
        ${statCard('Cash', money(ai.cash_collected), null, 'pos',
          "Cash collected to date on this channel's won deals (all installments, reconciled).")}`;
      } else {
        // Appointwise (SMS) — no dial funnel.
        cards = `
        ${statCard('Booked', num(ai.booked), null, null,
          'AI-booked opportunities in this channel — classified by GHL booking tag / source. Scope: Sales pipeline only, internal contacts excluded.')}
        ${statCard('Held', num(ai.held), 'showed up', null,
          "Booked calls the prospect attended — held-call stages or Call-1 status 'Showed'.")}
        ${statCard('Held Rate', pct(ai.held_rate), null, rateCls(ai.held_rate, 0.5, 0.25), 'Held ÷ Booked.')}
        ${statCard('Converted', num(ai.won), 'won', null, 'Booked opportunities that reached the Deal Won stage.')}
        ${statCard('Cash', money(ai.cash_collected), null, 'pos',
          "Cash collected to date on this channel's won deals (all installments, reconciled).")}`;
      }
      return `<div class="section"><h2>AI Booking Performance</h2><div class="stat-grid">${cards}</div>
      <div class="note" style="margin-top:12px">
        <strong>Attribution confidence:</strong> ${num(c.source_confirmed)} source-confirmed ·
        ${num(c.tag_inferred)} tag-inferred (${tagPct}%). Tag-inferred = bot-worked, booked during
        engagement (empty booking source). The upstream fix (bot stamps source at booking) migrates
        these to high-confidence over time.
      </div></div>`;
    }

    function renderAgentTable(agents) {
      if (!agents || !agents.length) return '';
      const rows = agents.map(a => `
        <tr>
          <td>${a.agent_name || '<span style="color:var(--text2)">' + (a.agent_id || '—').slice(0, 12) + '…</span>'}</td>
          <td class="num">${num(a.calls)}</td>
          <td class="num">${num(a.contacts)}</td>
          <td class="num">${num(a.picked_up)}</td>
          <td class="num ${rateCls(a.pickup_rate, 0.4, 0.2)}">${pct(a.pickup_rate)}</td>
          <td class="num">${a.minutes}m</td>
          <td class="num">${a.avg_sec ? a.avg_sec + 's' : '—'}</td>
        </tr>`).join('');
      return `<div class="section"><h2>By Agent</h2><div class="table-scroll"><table>
        <thead><tr><th>Agent</th><th class="num">Calls</th><th class="num">Contacts</th>
        <th class="num">Picked Up</th><th class="num">Pickup Rate</th><th class="num">Minutes</th>
        <th class="num">Avg Len</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    }

    function voiceDQSection() {
      // Container + filters; rows load lazily via loadVoiceCalls().
      return `<div class="section"><h2>Voice Calls / Data Quality</h2>
        <div style="display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
          <div style="display:flex;gap:6px">
            <button class="btn primary" id="dq-all" onclick="setDqMode('all')">All calls</button>
            <button class="btn ghost" id="dq-dq" onclick="setDqMode('dq')">Disqualified only</button>
          </div>
          <div style="width:1px;height:24px;background:var(--border)"></div>
          <div style="display:flex;gap:6px">
            <button class="btn primary" id="cn-all" onclick="setConn('all')">All</button>
            <button class="btn ghost" id="cn-picked_up" onclick="setConn('picked_up')">Picked up</button>
            <button class="btn ghost" id="cn-no_answer" onclick="setConn('no_answer')">No answer</button>
          </div>
          <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)">Min length
            <select id="min-len" onchange="setMinLen(this.value)"
              style="background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 8px;font-family:inherit;font-size:12px">
              <option value="0">Any</option>
              <option value="0.5">≥ 30s</option>
              <option value="1">≥ 1 min</option>
              <option value="2">≥ 2 min</option>
              <option value="5">≥ 5 min</option>
              <option value="10">≥ 10 min</option>
            </select>
          </label>
        </div>
        <div id="voice-calls"><div class="loading">Loading calls…</div></div></div>`;
    }

    function _toggleBtns(ids, active) {
      ids.forEach(id => {
        const b = document.getElementById(id);
        if (b) b.className = 'btn ' + (id.endsWith(active) ? 'primary' : 'ghost');
      });
    }

    window.setDqMode = function (mode) {
      dqMode = mode;
      _toggleBtns(['dq-all', 'dq-dq'], mode);
      loadVoiceCalls();
    };
    window.setConn = function (mode) {
      connMode = mode;
      _toggleBtns(['cn-all', 'cn-picked_up', 'cn-no_answer'], mode);
      loadVoiceCalls();
    };
    window.setMinLen = function (v) { minMin = v; loadVoiceCalls(); };

    async function loadVoiceCalls() {
      const host = document.getElementById('voice-calls');
      if (!host) return;
      host.innerHTML = '<div class="loading">Loading calls…</div>';
      try {
        const j = await apiFetch(`/api/dashboard/retell/calls?filter=${dqMode}&connection=${connMode}&min_minutes=${minMin}&start=${START}&end=${END}&date_by=${DATE_BY}`);
        const calls = j.data;
        if (!calls.length) {
          host.innerHTML = `<div class="empty">No Retell calls match these filters for this range. ` +
            `If you just added the API key, run a sync from <a class="link" href="/settings">Settings</a>.</div>`;
          return;
        }
        const upBadge = c => c.picked_up
          ? '<span class="pill" style="background:rgba(34,197,94,.15);color:var(--green)">picked up</span>'
          : '<span class="pill" style="background:rgba(148,163,184,.15);color:var(--text2)">no answer</span>';
        const rows = calls.map(c => {
          const when = c.started_at ? new Date(c.started_at).toLocaleString() : '—';
          const mins = c.duration_sec ? (c.duration_sec / 60).toFixed(1) + 'm' : '—';
          const contact = c.ghl_contact_name || (c.ghl_contact_id ? 'Matched' : '—');
          const conf = c.match_confidence
            ? `<span class="pill">${c.match_confidence}</span>`
            : '<span class="pill" style="background:rgba(148,163,184,.15);color:var(--text2)">unmatched</span>';
          const ghlLink = c.ghl_contact_id
            ? `<a class="link" href="${GHL_CONTACT_BASE}/${c.ghl_contact_id}" target="_blank">GHL ↗</a>` : '—';
          const retellLink = `<a class="link" href="${RETELL_CALL_BASE}/${c.retell_call_id}" target="_blank">Retell ↗</a>`;
          const player = c.has_recording
            ? `<audio controls preload="none" style="height:32px;max-width:220px" src="/api/dashboard/retell/recording/${encodeURIComponent(c.retell_call_id)}"></audio>`
            : '<span style="color:var(--text2)">no recording</span>';
          return `<tr>
            <td>${when}</td>
            <td>${contact} ${conf}</td>
            <td>${c.to_number || c.from_number || '—'}</td>
            <td class="num">${mins}</td>
            <td>${upBadge(c)}</td>
            <td>${c.call_status || '—'}${c.sentiment ? ' · ' + c.sentiment : ''}</td>
            <td>${ghlLink} · ${retellLink}</td>
            <td>${player}</td>
          </tr>`;
        }).join('');
        host.innerHTML = `<div class="table-scroll"><table>
          <thead><tr><th>When</th><th>Contact</th><th>Number</th><th class="num">Dur</th>
          <th>Connection</th><th>Outcome</th><th>Open in</th><th>Recording</th></tr></thead>
          <tbody>${rows}</tbody></table></div>`;
      } catch (e) {
        host.innerHTML = `<div class="empty">Failed to load calls. ${e.message}</div>`;
      }
    }

    function renderDqTiles(dq) {
      if (!dq) return '';
      const tile = (label, val, warnIf, tip) => {
        const bad = warnIf !== undefined && val > warnIf;
        return statCard(label, num(val), null, bad ? 'val-bad' : '', tip);
      };
      const fresh = dq.last_synced_at ? new Date(dq.last_synced_at).toLocaleString() : '—';
      return `<div class="section"><h2>Data Quality</h2><div class="stat-grid">
        ${tile('Same-contact ≥2 open', dq.same_contact_multi_open, 0,
          'Contacts with 2+ still-open opportunities in the Sales pipeline (not won / lost / DQ / no-show / cancelled). Expect 0 — a duplicate/leak alert.')}
        ${tile('$0 / ownerless wons', dq.zero_or_ownerless_wons, 3,
          'Won deals with no rep owner assigned. ~3 are known; anything above that is worth checking.')}
        ${tile('AI source, no tag', dq.method_token_without_tag, 0,
          'Opps with a definitive AI booking source (ai-caller / ai-chat / ai_bot) but no contact tags synced yet. Drops to ~0 after the tag backfill runs.')}
        ${tile("source='call' (phone/manual)", dq.source_call_pending, undefined,
          "Opps whose GHL booking source is 'call' — phone/manual bookings, NOT AI. Pending a channel definition (~123 expected).")}
        ${statCard('Last synced', fresh, null, null,
          'Timestamp of the most recent opportunity sync from GHL — how fresh the numbers on this page are.')}
      </div></div>`;
    }

    function renderBars(title, hist) {
      const entries = Object.entries(hist || {});
      const max = Math.max(1, ...entries.map(e => e[1]));
      const bars = entries.map(([k, v]) => `
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
          <span style="width:34px;font-size:12px;color:var(--text2)">${k}</span>
          <div style="flex:1;background:var(--surface2);border-radius:5px;height:18px;overflow:hidden">
            <div style="height:100%;width:${(v / max) * 100}%;background:var(--accent);min-width:${v ? 2 : 0}px"></div>
          </div>
          <span style="width:34px;text-align:right;font-size:12px">${v}</span>
        </div>`).join('');
      return `<div><div class="label" style="font-size:11px;color:var(--text2);text-transform:uppercase;margin-bottom:8px">${title}</div>${bars}</div>`;
    }

    function renderSmsSection(sms) {
      if (!sms || !sms.leads) {
        return `<div class="section"><h2>SMS Engagement</h2><div class="note">SMS engagement populates on the next GHL sync (captured from GHL Conversations for booked Appointwise leads). <a href="/settings">Connectors</a>.</div></div>`;
      }
      const hourStr = sms.peak_reply_hour !== null && sms.peak_reply_hour !== undefined
        ? (sms.peak_reply_hour % 12 || 12) + (sms.peak_reply_hour < 12 ? 'am' : 'pm') : '—';
      return `<div class="section"><h2>SMS Engagement <span style="font-size:11px;font-weight:400;color:var(--text2)">· booked leads</span></h2>
        <div class="stat-grid" style="margin-bottom:16px">
          ${statCard('Booked Leads', num(sms.leads), null, null, 'Appointwise leads that booked and have SMS history captured from GHL Conversations.')}
          ${statCard('Replied', pct(sms.reply_rate), num(sms.replied) + ' leads', null, 'Share of these leads who sent at least one inbound SMS.')}
          ${statCard('Avg Msgs / Lead', sms.avg_msgs_per_lead ?? '—', 'outbound', null, 'Average outbound SMS the bot sent per lead.')}
          ${statCard('Replies After', sms.avg_reply_after_n ? sms.avg_reply_after_n + ' msgs' : '—', 'to first reply', null, 'On average, how many outbound messages before the lead first replied.')}
          ${statCard('Reply Delay', sms.avg_first_reply_hours !== null ? sms.avg_first_reply_hours + 'h' : '—', 'avg', null, 'Average time from the first outbound SMS to the first reply.')}
          ${statCard('Opted Out', pct(sms.opt_out_rate), num(sms.opted_out) + ' leads', sms.opt_out_rate > 0.1 ? 'val-bad' : '', 'Share who texted STOP/unsubscribe.')}
          ${statCard('Peak Reply Hour', hourStr, 'when they reply', null, 'Hour of day most first-replies land (contact local not adjusted).')}
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px">
          ${renderBars('Reply on message #', sms.reply_by_message)}
          ${renderBars('Opt-out after # msgs', sms.opt_out_by_message)}
        </div></div>`;
    }

    function render(detail, closes, ai, dqTiles, agents, sms) {
      const h = detail.headline;
      document.getElementById('ch-name').textContent = detail.channel;
      document.getElementById('ch-subtitle').textContent =
        `${START} → ${END} · by ${DATE_BY} · ${num(h.total_ops)} opportunities`;
      document.title = `${detail.channel} — Channel Detail`;
      if (detail.channel === RETELL_CHANNEL) {
        const pill = document.getElementById('ch-pill');
        pill.textContent = 'AI VOICE'; pill.style.display = 'inline-block';
      }

      const funnel = `<div class="section"><h2>Funnel</h2><div class="stat-grid">
        ${statCard('Total Opps', num(h.total_ops), null, null,
          'Every opportunity attributed to this channel in the selected range, counted by the Date-by dimension (appointment / booked / created).')}
        ${statCard('Shows', num(h.shows), null, null,
          "Opportunities where the prospect showed for the 1st call — appointment status 'Showed', or the pipeline stage advanced past the call.")}
        ${statCard('Show Rate', pct(h.show_rate), null, rateCls(h.show_rate, 0.6, 0.3),
          'Shows ÷ Total Opps.')}
        ${statCard('Qualified', num(h.qualified), null, null,
          'Shows graded Great, Ok, or Barely Passable on the 1st call (excludes Bad, DQ, and ungraded).')}
        ${statCard('Qual Rate', pct(h.qual_rate), null, rateCls(h.qual_rate, 0.6, 0.3),
          'Qualified ÷ Shows (1st-call shows only).')}
        ${statCard('DQ Rate', pct(h.dq_rate), null, h.dq_rate === null ? '' : (h.dq_rate > 0.3 ? 'val-bad' : ''),
          'Disqualified ÷ 1st-call shows.')}
        ${statCard('Units Closed', num(h.units_closed), null, null,
          'Won deals whose 1st call falls inside the selected range (the cohort). A subset of Shows.')}
        ${statCard('Close Rate', pct(h.close_rate), 'of shows', rateCls(h.close_rate, 0.2, 0.05),
          'Units Closed ÷ Shows.')}
      </div></div>`;

      const revenue = `<div class="section"><h2>Revenue</h2><div class="stat-grid">
        ${statCard('Contract Value', money(h.contract_value), 'GHL-entered', 'pos',
          "Sum of GHL-entered deal value (monetary_value) on this channel's won deals. Rep-entered — not payment-verified.")}
        ${statCard('Contracted Total', money(h.whop_projected_total), 'payment-verified', 'pos',
          'Payment-verified projected full contract (Whop plan math): financed deals settle upfront; internal plans project avg installment × plan length.')}
        ${statCard('Cash Collected', money(h.cash_collected), 'to date', 'pos',
          'Cash collected to date on won deals — all installments as they land (reconciled Whop / Stripe / Wise).')}
        ${statCard('Avg Deal Size', h.avg_deal_size ? money(h.avg_deal_size) : '—', 'per close', null,
          'Contracted Total ÷ Units Closed.')}
      </div></div>`;

      const roi = `<div class="section"><h2>ROI &amp; Cost Efficiency</h2>${renderRoi(detail.roi)}</div>`;
      const quality = `<div class="section"><h2>Lead Quality (1st-call shows)</h2>${renderQualityBar(h)}</div>`;
      const reps = `<div class="section"><h2>Rep Breakdown</h2>${renderRepTable(detail.reps)}</div>`;
      const closesHtml = `<div class="section"><h2>Closed Deals</h2>${renderCloses(closes)}</div>`;
      const aiHtml = renderAiSection(ai, detail.roi);
      const dqHtml = isAI ? renderDqTiles(dqTiles) : '';
      const agentHtml = detail.channel === RETELL_CHANNEL ? renderAgentTable(agents) : '';
      const smsHtml = detail.channel === APPOINTWISE_CHANNEL ? renderSmsSection(sms) : '';
      const voiceHtml = detail.channel === RETELL_CHANNEL ? voiceDQSection() : '';

      document.getElementById('content').innerHTML =
        aiHtml + funnel + revenue + roi + agentHtml + smsHtml + quality + reps + voiceHtml + closesHtml + dqHtml;
      wireCost(detail.roi);
      if (detail.channel === RETELL_CHANNEL) loadVoiceCalls();
    }

    function wireCost() {
      const save = document.getElementById('save-cost');
      if (save) save.addEventListener('click', () => putCost(parseFloat(document.getElementById('cost-input').value)));
      const clear = document.getElementById('clear-cost');
      if (clear) clear.addEventListener('click', () => putCost(null));
    }

    async function putCost(cost) {
      try {
        await fetch(`/api/dashboard/channel-detail/cost?start=${START}&end=${END}&date_by=${DATE_BY}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ channel: CHANNEL, cost: (cost === null || isNaN(cost)) ? null : cost }),
        });
        await load();
      } catch (e) { alert('Failed to save cost: ' + e.message); }
    }

    async function load() {
      document.getElementById('content').innerHTML = '<div class="loading">Loading channel metrics…</div>';
      try {
        const reqs = [
          apiFetch(`/api/dashboard/channel-detail?${qs()}`),
          apiFetch(`/api/dashboard/channels/closes?${qs()}`),
        ];
        if (isAI) {
          reqs.push(apiFetch(`/api/dashboard/channel-detail/ai?${qs()}`));
          reqs.push(apiFetch(`/api/dashboard/ai/data-quality`));
        }
        if (CHANNEL === RETELL_CHANNEL) reqs.push(apiFetch(`/api/dashboard/retell/agents?${qs()}`));
        if (CHANNEL === APPOINTWISE_CHANNEL) reqs.push(apiFetch(`/api/dashboard/appointwise/sms`));
        const results = await Promise.all(reqs);
        const [detail, closes, ai, dq] = results;
        const extra = results[4] ? results[4].data : null;  // agents (Retell) | sms (Appointwise)
        render(detail.data, closes.data, ai ? ai.data : null, dq ? dq.data : null,
          CHANNEL === RETELL_CHANNEL ? extra : null, CHANNEL === APPOINTWISE_CHANNEL ? extra : null);
      } catch (e) {
        document.getElementById('content').innerHTML =
          `<div class="empty">Failed to load. ${e.message} <button class="btn" onclick="load()">Retry</button></div>`;
      }
    }

    // Preset date ranges (UTC, matching the app's date semantics).
    function presetRange(key) {
      const iso = d => d.toISOString().slice(0, 10);
      const now = new Date();
      const y = now.getUTCFullYear(), m = now.getUTCMonth();
      let s, e = now;
      if (key === '7d') { s = new Date(now); s.setUTCDate(now.getUTCDate() - 6); }
      else if (key === '30d') { s = new Date(now); s.setUTCDate(now.getUTCDate() - 29); }
      else if (key === '3m') { s = new Date(now); s.setUTCMonth(now.getUTCMonth() - 3); }
      else if (key === 'thismonth') { s = new Date(Date.UTC(y, m, 1)); }
      else if (key === 'lastmonth') { s = new Date(Date.UTC(y, m - 1, 1)); e = new Date(Date.UTC(y, m, 0)); }
      else { s = now; }
      return [iso(s), iso(e)];
    }

    function highlightPreset() {
      document.querySelectorAll('.preset-btn').forEach(b => {
        const [s, e] = presetRange(b.dataset.preset);
        b.classList.toggle('active', s === START && e === END);
      });
    }

    function commitRange() {
      const u = new URL(window.location);
      u.searchParams.set('start', START); u.searchParams.set('end', END); u.searchParams.set('date_by', DATE_BY);
      history.replaceState(null, '', u);
      document.getElementById('f-start').value = START;
      document.getElementById('f-end').value = END;
      document.getElementById('back-link').href = `/dashboard?start=${START}&end=${END}&date_by=${DATE_BY}`;
      highlightPreset();
      load();
    }

    function initControls() {
      document.getElementById('f-start').value = START;
      document.getElementById('f-end').value = END;
      document.getElementById('f-dateby').value = DATE_BY;
      document.getElementById('back-link').href = `/dashboard?start=${START}&end=${END}&date_by=${DATE_BY}`;
      document.getElementById('apply-btn').addEventListener('click', () => {
        START = document.getElementById('f-start').value;
        END = document.getElementById('f-end').value;
        DATE_BY = document.getElementById('f-dateby').value;
        commitRange();
      });
      document.querySelectorAll('.preset-btn').forEach(b => {
        b.addEventListener('click', () => {
          [START, END] = presetRange(b.dataset.preset);
          commitRange();
        });
      });
      highlightPreset();
    }

    initControls();
    load();
  </script>
  <script src="/static/tooltip.js"></script>
  <script src="/static/nav.js"></script>
</body>

</html>
